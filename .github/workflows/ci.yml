name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals
      - run: pytest -q
      - name: Agent benchmark (offline baseline)
        run: python evals/run_evals.py --provider offline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t transit-graph-agent .
      - run: |
          docker run -d -p 8000:8000 --name api transit-graph-agent
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs "localhost:8000/route?origin=Spandau&destination=Ostkreuz"
