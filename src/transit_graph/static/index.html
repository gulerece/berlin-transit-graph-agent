<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Berlin rail network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --concrete: #e8ecee;   /* page and map surroundings */
    --panel: #ffffff;
    --ink: #17252e;        /* text */
    --slate: #5f707a;      /* secondary text */
    --rule: #d3dadd;
    --go: #00844a;         /* actions, "on time" */
    --amber: #e39b00;      /* delays */
    --stop: #c8281e;       /* closures, errors */
    --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--concrete);
    display: grid;
    grid-template-columns: minmax(340px, 440px) 1fr;
    grid-template-rows: 100%;
  }

  /* ---------- conversation panel ---------- */
  .panel {
    background: var(--panel);
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
    border-right: 1px solid var(--rule);
  }
  header { padding: 22px 24px 14px; border-bottom: 1px solid var(--rule); }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .meta { color: var(--slate); font-size: 14px; margin: 0; }

  .thread { overflow-y: auto; padding: 8px 24px 24px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { .thread { scroll-behavior: auto; } }

  .intro p { margin: 16px 0 10px; color: var(--slate); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button {
    font: inherit;
    font-size: 14px;
    text-align: left;
    color: var(--ink);
    background: var(--concrete);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .examples button:hover { border-color: var(--go); }

  .turn { padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .turn:last-child { border-bottom: 0; }
  .question {
    font-family: var(--display);
    font-weight: 600;
    font-size: 21px;
    line-height: 1.2;
    margin: 0 0 10px;
  }
  .answer p { margin: 0 0 8px; }
  .answer ul { margin: 0 0 8px; padding-left: 20px; }
  .answer.error { color: var(--stop); }

  .pending { color: var(--slate); display: flex; align-items: center; gap: 10px; }
  .pending .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--go);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .pending .dot { animation: none; } }

  /* journey legs drawn like a platform indicator */
  .journey { margin: 12px 0 4px; }
  .journey .total { font-weight: 700; margin-bottom: 8px; }
  .leg { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
  .badge {
    font-family: var(--display);
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    text-align: center;
    border-radius: 999px;
    padding: 1px 8px;
    min-width: 46px;
  }
  .leg .where { line-height: 1.25; }
  .leg .mins { color: var(--slate); font-size: 14px; white-space: nowrap; }
  .transfer { color: var(--slate); font-size: 13px; padding: 0 0 0 74px; }

  details.how { margin-top: 10px; font-size: 14px; color: var(--slate); }
  details.how summary { cursor: pointer; }
  details.how code { font-size: 13px; color: var(--ink); background: var(--concrete); padding: 1px 5px; border-radius: 4px; }
  details.how ul { margin: 6px 0 0; padding-left: 18px; }

  form { display: flex; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid var(--rule); }
  input[type=text] {
    flex: 1;
    font: inherit;
    padding: 11px 13px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  form button {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--go);
    border: 0;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
  }
  form button:disabled { background: var(--slate); cursor: progress; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- map ---------- */
  #map { height: 100%; background: var(--concrete); }
  .leaflet-container { font-family: var(--body); }
  .leaflet-tile-pane { filter: grayscale(1) brightness(1.06) contrast(.85); opacity: .7; }
  .map-note {
    position: absolute; z-index: 500; right: 14px; top: 14px; max-width: 280px;
    background: rgba(255,255,255,.94); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; box-shadow: 0 1px 4px rgba(23,37,46,.18);
  }
  .map-note:empty { display: none; }
  .map-wrap { position: relative; min-height: 0; }
  .rank-label {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    background: var(--ink); color: #fff; border: 0; border-radius: 4px; padding: 0 5px;
    box-shadow: none;
  }
  .rank-label::before { display: none; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    .map-wrap { grid-row: 1; }
    .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--rule); }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <section class="panel" aria-label="Conversation">
    <header>
      <h1>Ask the Berlin rail network</h1>
      <p class="meta" id="meta">Loading network…</p>
    </header>

    <div class="thread" id="thread" aria-live="polite">
      <div class="intro" id="intro">
        <p>Ask about routes, delays, hubs or what happens when a station closes. Answers come from real Deutsche Bahn data and are drawn on the map.</p>
        <div class="examples">
          <button type="button">How do I get from Spandau to Grünau?</button>
          <button type="button">What happens if Ostkreuz is closed?</button>
          <button type="button">Where can I get from Hauptbahnhof in 10 minutes?</button>
          <button type="button">Which stations are the least punctual?</button>
          <button type="button">Which are the most important hubs?</button>
          <button type="button">Where does the S41 go?</button>
          <button type="button">Wie komme ich von Alex nach Wannsee?</button>
        </div>
      </div>
    </div>

    <form id="ask">
      <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Your question</label>
      <input type="text" id="q" autocomplete="off" placeholder="Ask a question, e.g. fastest way from Pankow to Südkreuz" required minlength="3" maxlength="500">
      <button type="submit" id="send">Ask</button>
    </form>
  </section>

  <div class="map-wrap">
    <div id="map" role="region" aria-label="Map of the Berlin rail network"></div>
    <div class="map-note" id="note"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
// Line colours follow the S-Bahn Berlin network map; other trains share one grey.
const LINE_COLOURS = {
  S1: "#DA6BA2", S2: "#007734", S25: "#007734", S26: "#007734", S3: "#0066AD",
  S41: "#AD5937", S42: "#CB6418", S45: "#CD9C53", S46: "#CD9C53", S47: "#CD9C53",
  S5: "#EB7405", S7: "#816DA6", S75: "#816DA6", S8: "#66AA22", S85: "#66AA22", S9: "#992746",
};
const OTHER = "#7d8a92";
const colourOf = line => LINE_COLOURS[line] || (line && line.startsWith("SEV") ? "#a7b1b6" : OTHER);
const primaryLine = lines => lines.find(l => LINE_COLOURS[l]) || lines[0];

const $ = id => document.getElementById(id);
const thread = $("thread"), form = $("ask"), input = $("q"), send = $("send"), note = $("note");
let stations = {};               // name -> {lat, lon, ...}

// ---------- map ----------
const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([52.515, 13.40], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18,
}).addTo(map);
const base = L.layerGroup().addTo(map);
const highlight = L.layerGroup().addTo(map);
const ll = name => stations[name] ? [stations[name].lat, stations[name].lon] : null;

function drawNetwork(net) {
  net.stations.forEach(s => { stations[s.name] = s; });
  net.edges.forEach(e => {
    const a = ll(e.from), b = ll(e.to);
    if (!a || !b) return;
    const line = primaryLine(e.lines);
    const sbahn = Boolean(LINE_COLOURS[line]);
    L.polyline([a, b], { color: colourOf(line), weight: sbahn ? 3 : 1.5, opacity: sbahn ? .6 : .3, sbahn })
      .bindTooltip(`${e.from} – ${e.to}: ${e.lines.join(", ")}`, { sticky: true })
      .addTo(base);
  });
  net.stations.forEach(s => {
    L.circleMarker([s.lat, s.lon], { radius: 3, color: "#17252e", weight: 1, fillColor: "#fff", fillOpacity: 1 })
      .bindTooltip(s.approximate ? `${s.name} (approximate position)` : s.name, { direction: "top" })
      .on("click", () => ask(`Tell me about ${s.name}`))
      .addTo(base);
  });
}

function dim(on) {
  base.eachLayer(l => {
    if (!l.setStyle) return;
    if (l instanceof L.CircleMarker) l.setStyle({ opacity: on ? .25 : 1, fillOpacity: on ? .4 : 1 });
    else l.setStyle({ opacity: (l.options.sbahn ? .6 : .3) * (on ? .4 : 1) });
  });
}

function stationDot(name, opts = {}) {
  const p = ll(name);
  if (!p) return null;
  return L.circleMarker(p, { radius: 7, color: "#17252e", weight: 2, fillColor: "#fff", fillOpacity: 1, ...opts })
    .bindTooltip(name, { direction: "top" }).addTo(highlight);
}

function fit(points) {
  const pts = points.filter(Boolean);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 14 });
}

const renderers = {
  plan_route(r) {
    if (!r.found) return;
    let i = 0;
    r.legs.forEach(leg => {
      const start = r.path.indexOf(leg.from, i), end = r.path.indexOf(leg.to, start + 1);
      const pts = r.path.slice(start, end + 1).map(ll);
      L.polyline(pts, { color: "#fff", weight: 11, opacity: 1 }).addTo(highlight);
      L.polyline(pts, { color: colourOf(leg.line), weight: 7, opacity: 1 }).addTo(highlight);
      i = end;
    });
    r.path.slice(1, -1).forEach(n => stationDot(n, { radius: 3.5, weight: 1.5 }));
    stationDot(r.origin, { fillColor: "#00844a", color: "#fff", radius: 9 });
    stationDot(r.destination, { fillColor: "#17252e", color: "#fff", radius: 9 });
    fit(r.path.map(ll));
    return `${r.origin} to ${r.destination}`;
  },
  reachable_within(r) {
    const max = r.budget_min;
    r.stations.forEach(s => {
      const t = s.minutes / max;
      const colour = t < .4 ? "#00844a" : t < .75 ? "#e39b00" : "#c8281e";
      stationDot(s.station, { radius: 6, fillColor: colour, color: "#fff", weight: 1.5 })
        ?.bindTooltip(`${s.station}: ${s.minutes} min`, { direction: "top" });
    });
    stationDot(r.origin, { radius: 10, fillColor: "#17252e", color: "#fff" });
    fit([ll(r.origin), ...r.stations.map(s => ll(s.station))]);
    return `${r.count} stations within ${max} min. Green is close, red is near the limit.`;
  },
  closure_impact(r) {
    const pairs = r.worst_pairs || [];
    pairs.forEach(p => {
      [p.from, p.to].forEach(n => stationDot(n, { radius: 6, fillColor: p.after_min === null ? "#c8281e" : "#e39b00", color: "#fff", weight: 1.5 }));
    });
    stationDot(r.station, { radius: 12, fillColor: "#fff", color: "#c8281e", weight: 4 });
    fit([ll(r.station), ...pairs.flatMap(p => [ll(p.from), ll(p.to)])]);
    return `Closing ${r.station}: red stations lose their rail connection, amber ones need a detour.`;
  },
  station_info(r) {
    (r.neighbours || []).forEach(n => {
      const a = ll(r.station), b = ll(n.station);
      if (a && b) L.polyline([a, b], { color: colourOf(primaryLine(n.lines)), weight: 6 }).addTo(highlight);
      stationDot(n.station, { radius: 5 });
    });
    stationDot(r.station, { radius: 10, fillColor: "#00844a", color: "#fff" });
    fit([ll(r.station), ...(r.neighbours || []).map(n => ll(n.station))]);
    return r.station;
  },
  hub_ranking(r) {
    const top = r.ranking[0]?.score || 1;
    r.ranking.forEach(h => {
      const m = stationDot(h.station, { radius: 6 + 14 * (h.score / top), fillColor: "#00844a", fillOpacity: .75, color: "#fff" });
      m?.bindTooltip(String(h.rank), { permanent: true, direction: "center", className: "rank-label" });
    });
    fit(r.ranking.map(h => ll(h.station)));
    return `Top ${r.ranking.length} stations by ${r.metric}: ${r.meaning}.`;
  },
  delay_hotspots(r) {
    if (r.kind === "stations") {
      r.hotspots.forEach(h => stationDot(h.station, {
        radius: 5 + (100 - h.punctuality_pct) * .6, fillColor: "#e39b00", fillOpacity: .8, color: "#fff",
      })?.bindTooltip(`${h.station}: ${h.punctuality_pct}% punctual`, { direction: "top" }));
      fit(r.hotspots.map(h => ll(h.station)));
      return "Bigger circles mean fewer trains on time.";
    }
    r.hotspots.forEach(h => {
      const a = ll(h.from), b = ll(h.to);
      if (a && b) L.polyline([a, b], { color: "#e39b00", weight: 4 + h.added_delay_min * 3 })
        .bindTooltip(`${h.from} to ${h.to}: +${h.added_delay_min} min`).addTo(highlight);
    });
    fit(r.hotspots.flatMap(h => [ll(h.from), ll(h.to)]));
    return "Thicker segments add more delay per train.";
  },
  line_info(r) {
    const stops = r.patterns?.[0]?.stops || [];
    L.polyline(stops.map(ll).filter(Boolean), { color: colourOf(r.line), weight: 7 }).addTo(highlight);
    stops.forEach(s => stationDot(s, { radius: 4 }));
    fit(stops.map(ll));
    const ring = stops.length > 2 && stops[0] === stops[stops.length - 1];
    return ring ? `${r.line}: ring line, ${stops.length - 1} stations` : `${r.line}: ${stops[0]} to ${stops[stops.length - 1]}`;
  },
  nearest_station(r) {
    r.nearest.forEach(n => stationDot(n.station, { fillColor: "#00844a", color: "#fff" }));
    fit(r.nearest.map(n => ll(n.station)));
  },
};

function show(toolResults) {
  highlight.clearLayers();
  note.textContent = "";
  const drawable = [...toolResults].reverse().find(t => renderers[t.name] && !t.result.error);
  dim(Boolean(drawable));
  if (!drawable) return;
  const caption = renderers[drawable.name](drawable.result);
  if (caption) note.textContent = caption;
}

// ---------- conversation ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Minimal, safe rendering of the agent's plain-text answer (paragraphs, bullet lists, **bold**).
function renderAnswer(text) {
  const box = el("div", "answer");
  let list = null;
  text.split(/\n+/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const bullet = line.match(/^([*\-•]|\d+\.)\s+(.*)$/);
    const target = bullet ? (list ||= box.appendChild(el("ul"))).appendChild(el("li")) : box.appendChild(el("p"));
    if (!bullet) list = null;
    (bullet ? bullet[2] : line).split(/\*\*/).forEach((part, i) => {
      target.appendChild(i % 2 ? el("strong", null, part) : document.createTextNode(part));
    });
  });
  return box;
}

function renderJourney(r) {
  const box = el("div", "journey");
  box.appendChild(el("div", "total",
    `${r.total_minutes} min, ${r.transfers === 0 ? "no transfers" : r.transfers === 1 ? "1 transfer" : r.transfers + " transfers"}`));
  r.legs.forEach((leg, i) => {
    if (i > 0) box.appendChild(el("div", "transfer", `Change at ${leg.from}`));
    const row = el("div", "leg");
    const badge = el("span", "badge", leg.line);
    badge.style.background = colourOf(leg.line);
    row.append(badge, el("span", "where", `${leg.from} to ${leg.to}`), el("span", "mins", `${leg.stops} stops, ${leg.minutes} min`));
    box.appendChild(row);
  });
  return box;
}

function renderHow(calls, latency) {
  const d = el("details", "how");
  d.appendChild(el("summary", null, `How the agent answered (${calls.length} tool call${calls.length === 1 ? "" : "s"}, ${latency.toFixed(1)} s)`));
  const ul = el("ul");
  calls.forEach(c => {
    const li = el("li");
    li.appendChild(el("code", null, c.name));
    const args = Object.entries(c.args).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(", ") : v}`).join(", ");
    li.appendChild(document.createTextNode(" " + args));
    ul.appendChild(li);
  });
  d.appendChild(ul);
  return d;
}

async function ask(question) {
  question = question.trim();
  if (question.length < 3) return;
  $("intro")?.remove();
  const turn = el("article", "turn");
  turn.appendChild(el("h2", "question", question));
  const pending = el("div", "pending");
  const started = performance.now();
  pending.append(el("span", "dot"), el("span", null, "Asking the network…"));
  turn.appendChild(pending);
  thread.appendChild(turn);
  thread.scrollTop = thread.scrollHeight;
  send.disabled = true; input.value = "";
  const timer = setInterval(() => {
    pending.lastChild.textContent = `Asking the network… ${Math.round((performance.now() - started) / 1000)} s`;
  }, 1000);

  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (!res.ok) throw new Error(`the server answered ${res.status}`);
    const data = await res.json();
    pending.remove();
    turn.appendChild(renderAnswer(data.answer || "The agent returned an empty answer. Try rephrasing the question."));
    const route = [...data.tool_results].reverse().find(t => t.name === "plan_route" && t.result.found);
    if (route) turn.appendChild(renderJourney(route.result));
    if (data.tool_calls.length) turn.appendChild(renderHow(data.tool_calls, data.latency_s));
    show(data.tool_results);
  } catch (err) {
    pending.remove();
    turn.appendChild(el("div", "answer error", `No answer: ${err.message}. Check that the server is running and try again.`));
  } finally {
    clearInterval(timer);
    send.disabled = false;
    input.focus();
    thread.scrollTop = thread.scrollHeight;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));

(async () => {
  try {
    const [health, net] = await Promise.all([fetch("/health").then(r => r.json()), fetch("/network").then(r => r.json())]);
    drawNetwork(net);
    const [from, to] = (health.period || []).map(p => new Date(p).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }));
    const agent = health.agent_backend === "offline" ? "offline baseline (no LLM)" : health.agent_backend;
    $("meta").textContent = `${health.stations} stations, ${from} to ${to}. Agent: ${agent}.`;
  } catch {
    $("meta").textContent = "Could not load the network. Is the API running?";
  }
})();
</script>
</body>
</html>
