[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-graph-agent"
version = "0.1.0"
description = "GraphRAG agent over a delay-aware knowledge graph of Berlin's rail network (LangGraph + MCP + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ece Güler" }]
license = { text = "MIT" }
dependencies = [
  "networkx>=3.3",
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "rapidfuzz>=3.6",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "mcp>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.0"]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
transit-graph = "transit_graph.cli:main"
transit-graph-mcp = "transit_graph.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905", "E731"]
